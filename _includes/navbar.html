<nav class="max-w-5xl mx-auto flex items-center justify-between px-4 sm:px-6 h-16">
  <!-- Brand Logo -->
  <div class="flex items-center gap-3">
    <a href="{{ '/' | relative_url }}" class="group flex items-center gap-1.5 font-bold tracking-tight text-base-content hover:text-primary transition-colors text-base sm:text-lg">
      <span class="font-mono text-primary font-bold text-base sm:text-lg group-hover:translate-x-0.5 transition-transform">&gt;</span>
      <span class="font-bold">arandilopez</span>
      <span class="font-mono text-xs opacity-50">.dev</span>
    </a>
  </div>

  <!-- Desktop Navigation -->
  <div class="hidden md:flex items-center gap-2">
    <ul class="flex items-center gap-1">
      {% include nav_links.html %}
    </ul>

    <div class="h-4 w-px bg-base-300 mx-2"></div>

    <!-- Theme Toggle -->
    <button id="theme-toggle-btn" type="button" aria-label="Toggle theme" class="cursor-pointer p-2 rounded-md border border-base-300 bg-base-100 hover:bg-base-200 text-base-content hover:text-primary transition-colors focus:outline-none" title="Toggle dark/light mode">
      <!-- Sun icon (shown in dark mode) -->
      <svg class="hidden [html[data-theme=dark]_&]:block w-4 h-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
      </svg>
      <!-- Moon icon (shown in light mode) -->
      <svg class="block [html[data-theme=dark]_&]:hidden w-4 h-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
      </svg>
    </button>
  </div>

  <!-- Mobile Menu & Theme Toggle -->
  <div class="flex md:hidden items-center gap-2">
    <button id="theme-toggle-btn-mobile" type="button" aria-label="Toggle theme" class="cursor-pointer p-2 rounded-md border border-base-300 bg-base-100 text-base-content hover:text-primary transition-colors focus:outline-none">
      <svg class="hidden [html[data-theme=dark]_&]:block w-4 h-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
      </svg>
      <svg class="block [html[data-theme=dark]_&]:hidden w-4 h-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
      </svg>
    </button>

    <div class="dropdown dropdown-end">
      <button tabindex="0" role="button" aria-label="Open menu" class="cursor-pointer p-2 rounded-md border border-base-300 bg-base-100 text-base-content hover:text-primary focus:outline-none">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" class="inline-block h-4 w-4 stroke-current">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
        </svg>
      </button>
      <ul tabindex="0" class="dropdown-content menu menu-sm bg-base-100 border border-base-300 rounded-lg z-[999] mt-3 w-48 p-2 shadow-xl">
        {% include nav_links.html %}
      </ul>
    </div>
  </div>
</nav>

<script>
  (function() {
    function toggleTheme() {
      var current = document.documentElement.getAttribute('data-theme') || 'light';
      var next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      try {
        localStorage.setItem('theme', next);
      } catch(e) {}
    }

    document.getElementById('theme-toggle-btn')?.addEventListener('click', toggleTheme);
    document.getElementById('theme-toggle-btn-mobile')?.addEventListener('click', toggleTheme);
  })();
</script>
