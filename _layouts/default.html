<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b0f17">
    <title>{{ page.title }}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,600&display=swap" rel="stylesheet">

    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
    <link rel="alternate icon" href="/assets/favicon.png" type="image/png">
    <link rel="apple-touch-icon" href="/assets/apple-icon-180x180.png">
    <link rel="manifest" href="/manifest.json">
    {% seo %}
    <link rel="stylesheet" href="/assets/styles.css">
    
    <script>
      (function() {
        try {
          var savedTheme = localStorage.getItem('theme');
          if (savedTheme) {
            document.documentElement.setAttribute('data-theme', savedTheme);
          } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.setAttribute('data-theme', 'dark');
          } else {
            document.documentElement.setAttribute('data-theme', 'light');
          }
        } catch (e) {}
      })();
    </script>
    
    <script defer src="https://assets.onedollarstats.com/stonks.js"></script>
  </head>
  <body class="bg-base-100 text-base-content tech-grid-bg min-h-screen flex flex-col antialiased selection:bg-primary/20 selection:text-primary">
    <a href="#main-content" class="skip-link">Skip to main content</a>
    <header class="sticky top-0 z-50 bg-base-100/80 backdrop-blur-md border-b border-base-300 transition-colors duration-200">
      {% include navbar.html %}
    </header>

    <main id="main-content" class="flex-1">
      {{ content }}
    </main>

    <footer class="border-t border-base-300 bg-base-200/50 mt-auto transition-colors duration-200">
      {% include footer.html %}
    </footer>
  </body>
</html>
